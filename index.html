<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Gom's Diary</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap");

    @font-face {
      font-family: "Pretendard";
      font-style: normal;
      font-weight: 45 920;
      font-display: swap;
      src: url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");
    }

    :root {
      --nds-bg-default: white;
      --nds-surface-500: white;
      --nds-surface-600: #f9fafb;
      --nds-label-500: #17191c;
      --nds-label-400: #525964;
      --nds-label-300: #9aa3b2;
      --nds-icon-500: #17191c;
      --nds-icon-400: #525964;
      --nds-border-300: rgba(155, 168, 198, .1607843137);
      --nds-border-400: rgba(155, 168, 198, .2392156863);
      --nds-border-500: rgba(155, 168, 198, .3215686275);
      --nds-container-primarybrand: #355bf7;
      --nds-label-primarybrand: #355bf7;
      --nds-container-secondary: rgba(155, 168, 198, .2392156863);
      --nds-hover-subtle: rgba(155, 168, 198, .1215686275);
      --nds-activated-subtle: rgba(155, 168, 198, .2);
      --nds-label-error: #ef5d5d;
      --nds-border-error: #ef5d5d;
      --nds-shadow-100: rgba(0, 0, 0, .0509803922);
      --nds-shadow-200: rgba(0, 0, 0, .0784313725);
      --nds-shadow-300: rgba(0, 0, 0, .1607843137);
      --nds-shadow-xs: 0px 1px 2px 0px var(--nds-shadow-100), 0px 0px 2px 0px var(--nds-shadow-100);
      --nds-shadow-sm: 0px 0px 2px 0px var(--nds-shadow-100), 0px 4px 8px 0px var(--nds-shadow-200);
      --nds-shadow-md: 0px 0px 2px 0px var(--nds-shadow-300), 0px 4px 12px 0px var(--nds-shadow-200), 0px 0px 24px 0px var(--nds-shadow-100);
      --nds-radius-8: 8px;
      --nds-radius-10: 10px;
      --nds-spacing-xxxxxsmall: 2px;
      --nds-spacing-xxxxsmall: 4px;
      --nds-spacing-xxxsmall: 6px;
      --nds-spacing-xxsmall: 8px;
      --nds-spacing-xsmall: 10px;
      --nds-spacing-small: 12px;
      --nds-spacing-medium: 18px;
      --nds-spacing-large: 24px;
      --nds-spacing-xlarge: 30px;
      --nds-spacing-xxlarge: 36px;
      --font-serif: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --font-sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --header-h: 52px;
      --tabs-h: 48px;
      --bottom-bar-h: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    button,
    textarea {
      font: inherit;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--nds-container-primarybrand);
      outline-offset: 2px;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--nds-bg-default) url("water-bg.png") center center / cover fixed no-repeat;
      color: var(--nds-label-500);
      font-family: var(--font-sans);
      line-height: 1.6;
      padding:
        calc(var(--nds-spacing-small) + var(--safe-top))
        calc(var(--nds-spacing-small) + var(--safe-right))
        calc(var(--nds-spacing-small) + var(--safe-bottom))
        calc(var(--nds-spacing-small) + var(--safe-left));
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      position: relative;
    }

    body.editor-open {
      padding-bottom: calc(var(--bottom-bar-h) + var(--nds-spacing-small) + var(--safe-bottom));
    }

    .app {
      width: 100%;
      min-width: 0;
      max-width: 1080px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--nds-spacing-small);
      min-height: var(--header-h);
      margin-bottom: var(--nds-spacing-medium);
      padding: var(--nds-spacing-xxxxsmall) var(--nds-spacing-xxxxxsmall);
    }

    .topbar-title h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.45rem, 7vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1.05;
      color: var(--nds-label-500);
      text-wrap: balance;
    }

    .topbar-title p {
      color: var(--nds-label-400);
      font-size: 0.82rem;
      margin-top: var(--nds-spacing-xxsmall);
      letter-spacing: -0.01em;
    }

    .btn-today-top {
      flex-shrink: 0;
      min-height: 44px;
      padding: 0 var(--nds-spacing-medium);
      border: 1px solid var(--nds-border-400);
      background: var(--nds-surface-500);
      border-radius: var(--nds-radius-8);
      color: var(--nds-label-500);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: var(--nds-shadow-xs);
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    .btn-today-top:hover {
      background: var(--nds-hover-subtle);
      border-color: var(--nds-border-500);
    }

    /* Mobile tabs */
    .tabs {
      display: flex;
      gap: var(--nds-spacing-xxxxsmall);
      margin-bottom: var(--nds-spacing-medium);
      background: var(--nds-container-secondary);
      border: 1px solid var(--nds-border-400);
      border-radius: var(--nds-radius-10);
      padding: var(--nds-spacing-xxxxsmall);
    }

    .tab {
      flex: 1;
      min-height: 44px;
      border: none;
      background: transparent;
      border-radius: var(--nds-radius-8);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--nds-label-400);
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }

    .tab.active {
      background: var(--nds-surface-500);
      color: var(--nds-label-500);
      box-shadow: var(--nds-shadow-xs);
    }

    .layout {
      display: flex;
      flex-direction: column;
      gap: var(--nds-spacing-medium);
    }

    .panel {
      display: none;
      min-width: 0;
    }

    .panel.active {
      display: block;
    }

    .card {
      background: var(--nds-surface-500);
      border: 1px solid var(--nds-border-500);
      border-radius: var(--nds-radius-10);
      box-shadow: var(--nds-shadow-sm);
      padding: var(--nds-spacing-medium);
      position: relative;
      overflow: hidden;
    }

    /* Calendar */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--nds-spacing-medium);
      gap: var(--nds-spacing-xxsmall);
      position: relative;
      z-index: 1;
    }

    .cal-header h2 {
      font-family: var(--font-serif);
      font-size: 1.22rem;
      font-weight: 800;
      flex: 1;
      text-align: center;
      letter-spacing: -0.03em;
      color: var(--nds-label-500);
    }

    .btn-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border: 1px solid var(--nds-border-400);
      background: var(--nds-surface-500);
      border-radius: var(--nds-radius-8);
      cursor: pointer;
      color: var(--nds-icon-500);
      font-size: 1.35rem;
      line-height: 1;
      touch-action: manipulation;
      box-shadow: var(--nds-shadow-xs);
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }

    .btn-icon:active {
      transform: scale(0.95);
      background: var(--nds-activated-subtle);
      border-color: var(--nds-border-500);
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: var(--nds-spacing-xxxxsmall);
      margin-bottom: var(--nds-spacing-xxsmall);
      position: relative;
      z-index: 1;
    }

    .weekdays span {
      text-align: center;
      font-size: 0.73rem;
      font-weight: 900;
      color: var(--nds-label-400);
      padding: var(--nds-spacing-xxxsmall) 0;
      letter-spacing: 0.04em;
    }

    .weekdays span:first-child { color: var(--nds-label-error); }
    .weekdays span:last-child { color: var(--nds-label-primarybrand); }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: var(--nds-spacing-xxxxsmall);
      touch-action: pan-y;
      position: relative;
      z-index: 1;
    }

    .day {
      aspect-ratio: 1;
      min-height: 44px;
      border: 1px solid transparent;
      background: var(--nds-surface-600);
      border-radius: var(--nds-radius-8);
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--nds-label-500);
      position: relative;
      touch-action: manipulation;
      transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease, transform 0.12s ease;
    }

    .day:nth-child(7n + 1):not(.selected) { color: var(--nds-label-error); }
    .day:nth-child(7n):not(.selected) { color: var(--nds-label-primarybrand); }

    .day:active:not(:disabled) {
      transform: scale(0.94);
      background: var(--nds-activated-subtle);
    }

    .day.other { color: var(--nds-label-300); }

    .day.today {
      font-weight: 700;
      color: var(--nds-label-primarybrand);
      background: var(--nds-surface-500);
      border-color: var(--nds-border-500);
    }

    .day.selected {
      background: var(--nds-container-primarybrand);
      color: #fff;
      font-weight: 700;
      border-color: var(--nds-container-primarybrand);
    }

    .day.selected.has-entry::after { background: #fff; }

    .day.has-entry::after {
      content: "";
      position: absolute;
      bottom: var(--nds-spacing-xxxsmall);
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--nds-label-primarybrand);
    }

    .day:disabled {
      cursor: default;
      visibility: hidden;
    }

    .cal-hint {
      margin-top: var(--nds-spacing-xsmall);
      text-align: center;
      font-size: 0.78rem;
      color: var(--nds-label-400);
      position: relative;
      z-index: 1;
    }

    /* Editor */
    .editor-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--nds-spacing-small);
      margin-bottom: var(--nds-spacing-medium);
      position: relative;
      z-index: 1;
    }

    .editor-heading {
      min-width: 0;
    }

    .editor {
      touch-action: pan-y;
    }

    .editor-header h2 {
      font-family: var(--font-serif);
      font-size: 1.38rem;
      font-weight: 800;
      margin-bottom: var(--nds-spacing-xxxsmall);
      letter-spacing: -0.035em;
      color: var(--nds-label-500);
    }

    .mood-field {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: var(--nds-spacing-xxxxsmall);
    }

    .editor-controls {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: var(--nds-spacing-xxsmall);
    }

    .mood-field select {
      min-width: 96px;
      min-height: 44px;
      padding: 0 32px 0 var(--nds-spacing-small);
      border: 1px solid var(--nds-border-400);
      border-radius: var(--nds-radius-8);
      background: var(--nds-surface-500);
      color: var(--nds-label-500);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .mood-field select:focus-visible {
      border-color: var(--nds-container-primarybrand);
      box-shadow: 0 0 0 3px rgba(53, 91, 247, 0.16);
    }

    .editor-toolbar {
      display: flex;
      align-items: center;
      margin: 0;
      position: relative;
      z-index: 1;
    }

    .editor-toolbar select {
      min-height: 44px;
      padding: 0 var(--nds-spacing-xsmall);
      border: 1px solid var(--nds-border-400);
      border-radius: var(--nds-radius-8);
      background: var(--nds-surface-500);
      color: var(--nds-label-500);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .editor-toolbar select:focus-visible {
      border-color: var(--nds-container-primarybrand);
      box-shadow: 0 0 0 3px rgba(53, 91, 247, 0.16);
    }

    .editor textarea {
      width: 100%;
      min-height: calc(100dvh - 320px);
      border: 1px solid var(--nds-border-500);
      border-radius: var(--nds-radius-10);
      padding: var(--nds-spacing-medium);
      font-family: "Gowun Dodum", "Malgun Gothic", sans-serif;
      font-size: 1.05rem;
      line-height: 1.85;
      resize: none;
      background: var(--nds-surface-500);
      color: var(--nds-label-500);
      outline: none;
      box-shadow: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
      -webkit-appearance: none;
      position: relative;
      z-index: 1;
    }

    .editor textarea:focus {
      border-color: var(--nds-container-primarybrand);
      box-shadow: 0 0 0 3px rgba(53, 91, 247, 0.16);
    }

    .editor textarea::placeholder { color: var(--nds-label-300); }

    .editor-actions {
      display: none;
    }

    .status {
      margin-top: var(--nds-spacing-xsmall);
      font-size: 0.85rem;
      color: var(--nds-label-400);
      min-height: 1.2em;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .status.saved { color: var(--nds-label-primarybrand); }

    /* Mobile bottom bar */
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      gap: var(--nds-spacing-xxsmall);
      padding:
        var(--nds-spacing-xsmall)
        calc(var(--nds-spacing-small) + var(--safe-right))
        calc(var(--nds-spacing-xsmall) + var(--safe-bottom))
        calc(var(--nds-spacing-small) + var(--safe-left));
      background: var(--nds-surface-500);
      border-top: 1px solid var(--nds-border-400);
      box-shadow: var(--nds-shadow-md);
      transform: translateY(110%);
      transition: transform 0.25s ease;
    }

    .bottom-bar.visible {
      transform: translateY(0);
    }

    .bottom-bar .btn {
      min-height: 48px;
      border-radius: var(--nds-radius-8);
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.12s ease, background 0.16s ease;
    }

    .bottom-bar .btn:active { transform: scale(0.98); }

    .bottom-bar .btn-primary {
      flex: 2;
      background: var(--nds-container-primarybrand);
      color: #fff;
    }

    .bottom-bar .btn-danger {
      flex: 1;
      background: var(--nds-surface-500);
      border: 1px solid var(--nds-border-error);
      color: var(--nds-label-error);
    }

    footer {
      text-align: center;
      margin-top: var(--nds-spacing-medium);
      font-size: 0.75rem;
      color: var(--nds-label-400);
      line-height: 1.5;
      padding-bottom: 4px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 430px) {
      .card {
        padding: var(--nds-spacing-small) var(--nds-spacing-xsmall);
      }

      .weekdays,
      .days {
        gap: var(--nds-spacing-xxxxxsmall);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    /* Desktop */
    @media (min-width: 769px) {
      body {
        padding:
          calc(var(--nds-spacing-xxlarge) + var(--safe-top))
          calc(var(--nds-spacing-large) + var(--safe-right))
          calc(var(--nds-spacing-xxlarge) + var(--safe-bottom))
          calc(var(--nds-spacing-large) + var(--safe-left));
      }

      body.editor-open {
        padding-bottom: calc(var(--nds-spacing-xxlarge) + var(--safe-bottom));
      }

      .topbar {
        justify-content: space-between;
        flex-direction: row;
        text-align: left;
        margin-bottom: var(--nds-spacing-xxlarge);
        min-height: auto;
        padding: var(--nds-spacing-xxsmall) var(--nds-spacing-xsmall);
      }

      .topbar-title h1 {
        font-size: clamp(2rem, 3.5vw, 2.8rem);
      }

      .topbar-title p {
        font-size: 1rem;
        margin-top: var(--nds-spacing-xsmall);
      }

      .btn-today-top {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .tabs { display: none; }

      .layout {
        display: grid;
        grid-template-columns: minmax(320px, 0.92fr) minmax(420px, 1.18fr);
        gap: var(--nds-spacing-xlarge);
        align-items: start;
      }

      .panel {
        display: block;
      }

      .card { padding: var(--nds-spacing-xlarge); }

      .cal-header h2 { font-size: 1.44rem; }

      .day:hover:not(:disabled) {
        background: var(--nds-hover-subtle);
        border-color: var(--nds-border-500);
        transform: translateY(-1px);
      }

      .btn-icon:hover {
        background: var(--nds-hover-subtle);
        border-color: var(--nds-border-500);
        transform: translateY(-1px);
      }

      .editor textarea {
        min-height: 420px;
        resize: vertical;
      }

      .editor-actions {
        display: flex;
        gap: var(--nds-spacing-xsmall);
        margin-top: var(--nds-spacing-medium);
        flex-wrap: wrap;
      }

      .editor-actions .btn {
        min-height: 44px;
        padding: var(--nds-spacing-xsmall) var(--nds-spacing-large);
        border-radius: var(--nds-radius-8);
        border: none;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: border-color 0.16s ease, color 0.16s ease, transform 0.12s ease, background 0.16s ease;
      }

      .editor-actions .btn:active { transform: scale(0.98); }

      .editor-actions .btn-primary {
        background: var(--nds-container-primarybrand);
        color: #fff;
      }

      .editor-actions .btn-primary:hover { filter: brightness(0.94); }

      .editor-actions .btn-secondary {
        background: var(--nds-surface-500);
        border: 1px solid var(--nds-border-400);
        color: var(--nds-label-400);
      }

      .editor-actions .btn-secondary:hover {
        background: var(--nds-hover-subtle);
        border-color: var(--nds-border-500);
        color: var(--nds-label-primarybrand);
      }

      .editor-actions .btn-danger {
        background: var(--nds-surface-500);
        border: 1px solid var(--nds-border-error);
        color: var(--nds-label-error);
      }

      .editor-actions .btn-danger:hover {
        background: var(--nds-hover-subtle);
      }

      .bottom-bar { display: none; }

      .cal-hint { display: none; }

      footer {
        margin-top: var(--nds-spacing-xxlarge);
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-title">
        <h1>Gom's Diary</h1>
        <p>오늘의 마음을 가볍게 남겨두세요</p>
      </div>
      <button class="btn-today-top" id="todayTopBtn" type="button">오늘</button>
    </header>

    <nav class="tabs" role="tablist" aria-label="화면 전환">
      <button class="tab active" id="tabCalendar" type="button" role="tab" aria-selected="true" aria-controls="panelCalendar" data-panel="calendar">달력</button>
      <button class="tab" id="tabEditor" type="button" role="tab" aria-selected="false" aria-controls="panelEditor" data-panel="editor">일기</button>
    </nav>

    <div class="layout">
      <section class="panel active card calendar" id="panelCalendar" role="tabpanel" aria-labelledby="tabCalendar">
        <div class="cal-header">
          <button class="btn-icon" id="prevMonth" type="button" aria-label="이전 달">‹</button>
          <h2 id="monthLabel"></h2>
          <button class="btn-icon" id="nextMonth" type="button" aria-label="다음 달">›</button>
        </div>
        <div class="weekdays">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="days" id="daysGrid"></div>
        <p class="cal-hint">날짜를 누르면 일기 화면으로 이동합니다</p>
      </section>

      <section class="panel card editor" id="panelEditor" role="tabpanel" aria-labelledby="tabEditor">
        <div class="editor-header">
          <div class="editor-heading">
            <h2 id="editorTitle"></h2>
          </div>
          <div class="editor-controls">
            <div class="mood-field">
              <select id="moodSelect" aria-label="오늘의 기분">
                <option value="">오늘의 기분</option>
                <option value="happy">😊 행복</option>
                <option value="excited">🥰 설렘</option>
                <option value="calm">😌 편안</option>
                <option value="normal">😐 보통</option>
                <option value="sad">😔 우울</option>
                <option value="angry">😡 화남</option>
              </select>
            </div>
            <div class="editor-toolbar">
              <select id="fontSizeSelect" aria-label="글자 크기">
                <option value="15">글자: 작게</option>
                <option value="17" selected>글자: 보통</option>
                <option value="20">글자: 크게</option>
                <option value="24">글자: 아주 크게</option>
              </select>
            </div>
          </div>
        </div>
        <textarea
          id="entryText"
          placeholder="오늘 마음에 오래 남은 장면을 적어보세요."
          aria-label="일기 내용"
          enterkeyhint="done"
        ></textarea>
        <div class="editor-actions">
          <button class="btn btn-primary" id="saveBtn" type="button">저장</button>
          <button class="btn btn-secondary" id="todayBtn" type="button">오늘로 이동</button>
          <button class="btn btn-danger" id="deleteBtn" type="button">삭제</button>
        </div>
        <p class="status" id="status" aria-live="polite"></p>
      </section>
    </div>

    <footer>기록은 브라우저 localStorage에만 저장됩니다 · 서버로 전송되지 않습니다</footer>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <button class="btn btn-danger" id="deleteBtnMobile" type="button">삭제</button>
    <button class="btn btn-primary" id="saveBtnMobile" type="button">저장</button>
  </div>

  <script>
    const STORAGE_KEY = "my-diary-entries";
    const MOOD_STORAGE_KEY = "my-diary-moods";
    const FONT_SIZE_STORAGE_KEY = "my-diary-font-size";
    const MOBILE_BP = 768;

    const monthLabel = document.getElementById("monthLabel");
    const daysGrid = document.getElementById("daysGrid");
    const entryText = document.getElementById("entryText");
    const editorTitle = document.getElementById("editorTitle");
    const moodSelect = document.getElementById("moodSelect");
    const fontSizeSelect = document.getElementById("fontSizeSelect");
    const status = document.getElementById("status");
    const panelCalendar = document.getElementById("panelCalendar");
    const panelEditor = document.getElementById("panelEditor");
    const tabCalendar = document.getElementById("tabCalendar");
    const tabEditor = document.getElementById("tabEditor");
    const bottomBar = document.getElementById("bottomBar");

    let viewDate = new Date();
    let selectedDate = formatDate(new Date());
    let touchStartX = 0;
    let editorTouchStartX = 0;
    let editorTouchStartY = 0;

    function isMobile() {
      return window.innerWidth <= MOBILE_BP;
    }

    function formatDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function parseDate(str) {
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDisplay(str) {
      const d = parseDate(str);
      const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
      return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}(${weekdays[d.getDay()]})`;
    }

    function loadEntries() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveEntries(entries) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function loadMoods() {
      try {
        return JSON.parse(localStorage.getItem(MOOD_STORAGE_KEY)) || {};
      } catch {
        return {};
      }
    }

    function setMood(dateStr, mood) {
      const moods = loadMoods();
      if (mood) {
        moods[dateStr] = mood;
      } else {
        delete moods[dateStr];
      }
      localStorage.setItem(MOOD_STORAGE_KEY, JSON.stringify(moods));
    }

    function getEntry(dateStr) {
      return loadEntries()[dateStr] || "";
    }

    function setEntry(dateStr, text) {
      const entries = loadEntries();
      const trimmed = text.trim();
      if (trimmed) {
        entries[dateStr] = trimmed;
      } else {
        delete entries[dateStr];
      }
      saveEntries(entries);
    }

    function switchPanel(name) {
      const isCalendar = name === "calendar";
      panelCalendar.classList.toggle("active", isCalendar);
      panelEditor.classList.toggle("active", !isCalendar);
      tabCalendar.classList.toggle("active", isCalendar);
      tabEditor.classList.toggle("active", !isCalendar);
      tabCalendar.setAttribute("aria-selected", String(isCalendar));
      tabEditor.setAttribute("aria-selected", String(!isCalendar));
      bottomBar.classList.toggle("visible", !isCalendar && isMobile());
      document.body.classList.toggle("editor-open", !isCalendar && isMobile());
    }

    function renderCalendar() {
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      monthLabel.textContent = `${year}년 ${month + 1}월`;

      const entries = loadEntries();
      const todayStr = formatDate(new Date());
      const firstDay = new Date(year, month, 1);
      const startOffset = firstDay.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();

      daysGrid.innerHTML = "";

      for (let i = 0; i < startOffset; i++) {
        const btn = document.createElement("button");
        btn.className = "day other";
        btn.textContent = prevMonthDays - startOffset + i + 1;
        btn.disabled = true;
        btn.type = "button";
        daysGrid.appendChild(btn);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = formatDate(new Date(year, month, d));
        const btn = document.createElement("button");
        btn.className = "day";
        btn.type = "button";
        btn.textContent = d;
        btn.dataset.date = dateStr;
        btn.setAttribute("aria-label", `${month + 1}월 ${d}일${entries[dateStr] ? ", 작성한 일기 있음" : ""}`);

        if (entries[dateStr]) btn.classList.add("has-entry");
        if (dateStr === todayStr) btn.classList.add("today");
        if (dateStr === selectedDate) {
          btn.classList.add("selected");
          btn.setAttribute("aria-current", "date");
        }

        btn.addEventListener("click", () => selectDate(dateStr, true));
        daysGrid.appendChild(btn);
      }

      const totalCells = startOffset + daysInMonth;
      const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
      for (let i = 1; i <= remaining; i++) {
        const btn = document.createElement("button");
        btn.className = "day other";
        btn.textContent = i;
        btn.disabled = true;
        btn.type = "button";
        daysGrid.appendChild(btn);
      }
    }

    function selectDate(dateStr, goToEditor) {
      selectedDate = dateStr;
      const entry = getEntry(dateStr);
      entryText.value = entry;
      editorTitle.textContent = formatDisplay(dateStr);
      moodSelect.value = loadMoods()[dateStr] || "";
      status.textContent = "";
      status.className = "status";
      renderCalendar();

      if (goToEditor && isMobile()) {
        switchPanel("editor");
        entryText.focus({ preventScroll: true });
      }
    }

    function showStatus(msg, type) {
      status.textContent = msg;
      status.className = type === "saved" ? "status saved" : "status";
    }

    function saveEntry() {
      setEntry(selectedDate, entryText.value);
      showStatus("저장되었습니다.", "saved");
      renderCalendar();
      entryText.blur();
    }

    function deleteEntry() {
      if (!getEntry(selectedDate) && !entryText.value.trim()) {
        showStatus("삭제할 일기가 없습니다.");
        return;
      }
      if (!confirm(`${formatDisplay(selectedDate)} 일기를 삭제할까요?`)) return;
      setEntry(selectedDate, "");
      entryText.value = "";
      showStatus("삭제되었습니다.");
      renderCalendar();
    }

    function goToToday() {
      const today = new Date();
      viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
      selectDate(formatDate(today), isMobile());
    }

    function moveSelectedDate(dayOffset) {
      const currentText = entryText.value.trim();
      const savedText = getEntry(selectedDate);

      if (currentText && currentText !== savedText) {
        setEntry(selectedDate, currentText);
      }

      const nextDate = parseDate(selectedDate);
      nextDate.setDate(nextDate.getDate() + dayOffset);
      viewDate = new Date(nextDate.getFullYear(), nextDate.getMonth(), 1);
      selectDate(formatDate(nextDate), false);
    }

    tabCalendar.addEventListener("click", () => switchPanel("calendar"));
    tabEditor.addEventListener("click", () => switchPanel("editor"));

    document.getElementById("prevMonth").addEventListener("click", () => {
      viewDate.setMonth(viewDate.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      viewDate.setMonth(viewDate.getMonth() + 1);
      renderCalendar();
    });

    document.getElementById("saveBtn").addEventListener("click", saveEntry);
    document.getElementById("saveBtnMobile").addEventListener("click", saveEntry);
    document.getElementById("deleteBtn").addEventListener("click", deleteEntry);
    document.getElementById("deleteBtnMobile").addEventListener("click", deleteEntry);
    document.getElementById("todayBtn").addEventListener("click", goToToday);
    document.getElementById("todayTopBtn").addEventListener("click", goToToday);

    moodSelect.addEventListener("change", () => {
      setMood(selectedDate, moodSelect.value);
      showStatus(moodSelect.value ? "오늘의 기분을 저장했습니다." : "기분 표시를 지웠습니다.", "saved");
    });

    fontSizeSelect.addEventListener("change", () => {
      const fontSize = fontSizeSelect.value;
      entryText.style.fontSize = `${fontSize}px`;
      localStorage.setItem(FONT_SIZE_STORAGE_KEY, fontSize);
    });

    entryText.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "s") {
        e.preventDefault();
        saveEntry();
      }
    });

    daysGrid.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].clientX;
    }, { passive: true });

    daysGrid.addEventListener("touchend", (e) => {
      const diff = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(diff) < 60) return;
      if (diff > 0) {
        viewDate.setMonth(viewDate.getMonth() - 1);
      } else {
        viewDate.setMonth(viewDate.getMonth() + 1);
      }
      renderCalendar();
    }, { passive: true });

    panelEditor.addEventListener("touchstart", (e) => {
      if (!isMobile()) return;
      editorTouchStartX = e.changedTouches[0].clientX;
      editorTouchStartY = e.changedTouches[0].clientY;
    }, { passive: true });

    panelEditor.addEventListener("touchend", (e) => {
      if (!isMobile()) return;

      const diffX = e.changedTouches[0].clientX - editorTouchStartX;
      const diffY = e.changedTouches[0].clientY - editorTouchStartY;

      if (Math.abs(diffX) < 60 || Math.abs(diffX) <= Math.abs(diffY) * 1.25) return;
      moveSelectedDate(diffX > 0 ? -1 : 1);
    }, { passive: true });

    window.addEventListener("resize", () => {
      if (!isMobile()) {
        panelCalendar.classList.add("active");
        panelEditor.classList.add("active");
        bottomBar.classList.remove("visible");
        document.body.classList.remove("editor-open");
      } else {
        const onEditor = tabEditor.classList.contains("active");
        panelCalendar.classList.toggle("active", !onEditor);
        panelEditor.classList.toggle("active", onEditor);
        bottomBar.classList.toggle("visible", onEditor);
        document.body.classList.toggle("editor-open", onEditor);
      }
    });

    const savedFontSize = localStorage.getItem(FONT_SIZE_STORAGE_KEY);
    if (["15", "17", "20", "24"].includes(savedFontSize)) {
      fontSizeSelect.value = savedFontSize;
    }
    entryText.style.fontSize = `${fontSizeSelect.value}px`;

    selectDate(selectedDate, false);
    switchPanel("calendar");
  </script>
</body>
</html>
